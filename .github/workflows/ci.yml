name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ChaosToolkit tests + API contract
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' | xargs -r -n1 node --check
      - name: Validate experiment definitions
        run: node -e 'const fs = require("fs"); for (const f of fs.readdirSync("experiments").filter((x) => x.endsWith(".json"))) { JSON.parse(fs.readFileSync("experiments/" + f, "utf8")); console.log("ok", f); }'
      - name: Unit, HTTP and contract tests
        run: npm test

